[project]
name = "netbox-search"
version = "0.1.0"
description = "HTMX + FastAPI fuzzy search over NetBox IPAM/Virtualization data"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.53.0",
]
